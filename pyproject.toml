[project]
name = "automatic-image-segmentation"
version = "0.1.0"
description = "Automatic image segmentation by guiding SAM with saliency maps"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
    # Deep learning (PyPI wheels for Linux ship with CUDA 12.1 runtime libs)
    "torch==2.4.1",
    "torchvision==0.19.1",
    "segment-anything @ git+https://github.com/facebookresearch/segment-anything.git@6fdee8f",
    # XAI / saliency
    "captum~=0.7.0",
    "torchcam~=0.4.0",
    "zennit~=0.5.1",
    # Scientific stack
    "numpy>=1.26,<2",
    "scipy>=1.14",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "pillow~=10.3",
    "opencv-python-headless>=4.10,<4.11",
    "tqdm>=4.66",
    # Caps BLAS/OpenMP threads at startup (see tools/thread-limits)
    "thread-limits",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
]

[tool.uv.sources]
thread-limits = { path = "tools/thread-limits", editable = false }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true  # segment-anything from GitHub

[tool.hatch.build.targets.wheel]
packages = ["saliency_sam"]

[tool.uv]
environments = ["sys_platform == 'linux'"]
