[project]
name = "thread-limits"
version = "0.1.0"
description = "Caps BLAS/OpenMP thread counts at interpreter startup (avoids OpenBLAS crashes on >128-core hosts)"
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["thread_limits.py"]

[tool.hatch.build.targets.wheel.force-include]
"thread_limits.pth" = "thread_limits.pth"
